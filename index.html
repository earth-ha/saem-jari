function makeStudents(n){return Array.from({length:n},(_,i)=>S.students[i]||{n:i+1,name:'',gender:''})}function layout(p,n){let cells=[],groups=p===1?[1,1,1,1,1]:p===2?[1,1,1,1,1,1]:p===3?[2,3,2]:p===7?[1,1,1,1,1,1,1]:[2,2,2];if(p===4||p===5){let order=[];for(let r=0;r<8;r++)for(let j=0;j<12;j++){let x=j-5.5,y=r;let score=p===4?Math.min(j,11-j,7-r)*20+Math.abs(y-4)*.05:Math.abs(Math.hypot(x/1.2,y-0.3)-5)*10+Math.abs(x)*.01;order.push({j,r,score})}order.sort((a,b)=>a.score-b.score);cells=order.slice(0,n).map(q=>[84+q.j*72,136+q.r*68]);}else{if(n>groups.reduce((a,b)=>a+b,0)*8)groups=[1,1,1,1,1,1];let cols=groups.reduce((a,b)=>a+b,0),xs=[],total=cols+groups.length-1,offset=Math.floor((12-total)/2);for(let w of groups){for(let j=0;j<w;j++)xs.push(offset+j);offset+=w+1}for(let i=0;i<n;i++){let j=i%cols,r=Math.floor(i/cols);cells.push([84+xs[j]*72,136+r*68+(p===6&&j%2?8:0)])}}return cells.map(([x,y],i)=>({id:i+1,x,y,r:0,n:null,fixed:false}))}

tion renderPresets(){$('presets').replaceChildren();presets.forEach((p,i)=>{let b=document.createElement('button');b.className='tile '+(S.preset===i?'on':'');let ds=layout(i,S.students.length);b.innerHTML=`<svg viewBox="0 0 960 680"><rect x="340" y="35" width="280" height="40" rx="8" fill="#729286"/>${ds.map(d=>`<rect x="${d.x-29}" y="${d.y-20}" width="58" height="40" rx="5" transform="rotate(${d.r} ${d.x} ${d.y})" fill="#8ba9c8"/>`).join('')}</svg>${p}`;b.onclick=()=>{if(S.desks.some(d=>d.n)&&!confirm('배치를 변경하면 기존 좌석 배정이 초기화됩니다. 계속할까요?'))return;S.preset=i;S.desks=layout(i,S.students.length);renderPresets();save()};$('presets').append(b)});$('capacity').textContent=`학생 ${S.students.length}명 · 책상 ${S.desks.length}개`}

let lastPoolTap=null,lastSeatTap=null;function poolClick(n){let now=performance.now();if(lastPoolTap?.n===n&&now-lastPoolTap.t<420){lastPoolTap=null;let d=S.desks.filter(d=>!d.n).sort((a,b)=>a.y-b.y||a.x-b.x)[0];if(d){assign(d,n);dropPulse={ids:[d.id],time:now};beep(560)}else motion('빈 좌석이 없습니다');return}lastPoolTap={n,t:now};lastSeatTap=null;selected=n;seatSelected=null;refresh()}function seatTap(d){let now=performance.now();if(mode==='prep'&&d.n&&lastSeatTap?.id===d.id&&lastSeatTap.n===d.n&&now-lastSeatTap.t<420){lastSeatTap=null;seatSelected=d.id;returnSelected();beep(420);return}lastSeatTap=d.n?{id:d.id,n:d.n,t:now}:null;lastPoolTap=null;seatClick(d)}function returnSelected(){let d=S.desks.find(d=>d.id===seatSelected&&d.n);if(!d||mode!=='prep')return;snapshot();let who=name(d.n);d.n=null;d.fixed=false;selected=seatSelected=null;save();refresh();motion(who+' · 대기 명단으로 이동')}function returnAllStudents(){if(!S.desks.some(d=>d.n))return;if(!confirm('고정된 학생을 포함해 모든 학생을 대기 명단으로 옮길까요? 책상 배치와 학생 명단은 유지됩니다.'))return;snapshot();epoch++;drawing=false;autoQueue=[];actors=[];pair=[];chosen=null;selected=seatSelected=null;S.desks.forEach(d=>{d.n=null;d.fixed=false});mode='prep';$('initial').value=0;$('ticketNum').textContent='?';save();refresh();motion('모든 학생이 대기 명단으로 이동했습니다.')}function editLayout(){if(S.desks.some(d=>d.r)){snapshot();S.desks.forEach(d=>d.r=0);save()}mode='layout';selected=seatSelected=null;refresh()}function finishLayout(){if(S.desks.length<S.students.length){alert(`책상이 ${S.students.length-S.desks.length}개 부족합니다.`);return}mode='prep';seatSelected=null;save();refresh()}const gx=84,gy=136,gw=72,gh=68;function gridPoint(x,y){return {x:gx+Math.max(0,Math.min(11,Math.round((x-gx)/gw)))*gw,y:gy+Math.max(0,Math.min(7,Math.round((y-gy)/gh)))*gh}}function fits(p,skip){return !S.desks.some(d=>d.id!==skip&&Math.abs(d.x-p.x)<66&&Math.abs(d.y-p.y)<60)}function freeCells(){let a=[];for(let r=0;r<8;r++)for(let j=0;j<12;j++)a.push({x:gx+j*gw,y:gy+r*gh});return a}function addDesk(p){if(S.desks.length>=80)return;let q=p?gridPoint(p.x,p.y):freeCells().find(q=>fits(q));if(!q||!fits(q)){motion('빈 칸을 선택하세요');return}snapshot();let id=Math.max(0,...S.desks.map(d=>d.id))+1;S.desks.push({id,...q,r:0,n:null,fixed:false});seatSelected=id;refresh();save()}function alignDesks(){snapshot();let available=freeCells();for(let d of S.desks){available.sort((a,b)=>Math.hypot(a.x-d.x,a.y-d.y)-Math.hypot(b.x-d.x,b.y-d.y));let q=available.shift();if(q)Object.assign(d,q,{r:0})}save();refresh();motion('줄 맞춤 완료 ✓')}function deleteDesk(){if(!seatSelected)return;snapshot();S.desks=S.desks.filter(d=>d.id!==seatSelected);seatSelected=null;save();refresh()}function unfix(){let d=S.desks.find(d=>d.id===seatSelected&&d.n);if(d&&mode==='prep'){snapshot();d.fixed=!d.fixed;save();refresh();motion(d.fixed?'자리 고정 완료':'자리 고정 해제');beep(520)}}function flip(){flipped=!flipped;motion(flipped?'교사 시점':'학생 시점')}function mix(quiet=false){if(S.desks.length<S.students.length)return;snapshot();let fixed=new Set(S.desks.filter(d=>d.fixed&&d.n).map(d=>d.n)),pool=S.students.filter(e=>!fixed.has(e.n)).map(e=>e.n);for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let free=S.desks.filter(d=>!d.fixed||!d.n);while(pool.length<free.length)pool.push(null);for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}for(let d of free){d.fixed=false;d.n=pool.shift()??null}selected=seatSelected=null;save();if(!quiet){refresh();motion('자리 배정 완료 ✓')}}
